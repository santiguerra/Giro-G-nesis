name: KhorApp
options:
  bundleIdPrefix: com.khor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.khor.app
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_FILE: KhorApp/Info.plist

packages:
  FirebaseAuth:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

targets:
  KhorApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KhorApp
        excludes:
          - "Info.plist"
    resources:
      - path: KhorApp/Resources
        optional: true
    info:
      path: KhorApp/Info.plist
      properties:
        CFBundleDisplayName: Khor
        CFBundleName: KhorApp
        CFBundleIdentifier: com.khor.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Khor usa la cámara para analizar tus comidas con IA."
        NSMicrophoneUsageDescription: "Khor usa el micrófono para entrada de voz."
        NSPhotoLibraryUsageDescription: "Khor accede a tus fotos para analizar comidas."
        GEMINI_API_KEY: "$(GEMINI_API_KEY)"
        GIDClientID: "$(GID_CLIENT_ID)"
    dependencies:
      - package: FirebaseAuth
        product: FirebaseAuth
      - package: FirebaseAuth
        product: FirebaseFirestore
      - package: FirebaseAuth
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khor.app
        INFOPLIST_FILE: KhorApp/Info.plist
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
